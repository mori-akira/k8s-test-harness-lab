# local 専用のダミー値。Git に入れてよい値のみ置く (dev では Secrets Manager から /secrets を埋める)
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: idp
type: Opaque
stringData:
  admin-username: admin
  admin-password: admin
  user-password-ci: ci-password
  user-password-human: human-password
  # api-b の Secret (api-b-secret.yaml) と同じ値にする
  api-b-client-secret: api-b-dummy-secret
