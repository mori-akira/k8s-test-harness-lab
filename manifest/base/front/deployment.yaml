apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: front
          envFrom:
            - configMapRef:
                name: front-config
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /config.js, port: http }
            periodSeconds: 5
