apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front
  namespace: front
spec:
  rules:
    # host は overlay で差し替える
    - host: front.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  name: http
