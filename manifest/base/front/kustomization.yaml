apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: front-config
    namespace: front
    literals:
      # ブラウザから見える URL。overlay で差し替える
      - OIDC_ISSUER=http://keycloak.invalid/realms/lab
      - OIDC_CLIENT_ID=front
      - API_BASE=http://api-a.invalid
