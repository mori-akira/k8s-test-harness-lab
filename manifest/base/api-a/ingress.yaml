apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-a
  namespace: api-a
spec:
  rules:
    # host は overlay で差し替える
    - host: api-a.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-a
                port:
                  name: http
