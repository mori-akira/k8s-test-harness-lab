apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: api-b-config
    namespace: api-b
    literals:
      # Keycloak の KC_HOSTNAME と同じ URL にすること。overlay で差し替える
      - OIDC_ISSUER=http://keycloak.invalid/realms/lab
      - OIDC_CLIENT_ID=api-b
      - API_A_BASE_URL=http://api-a.api-a.svc.cluster.local:8080
      # 外部呼び出しの seam。(2) では Toxiproxy に向ける。overlay で差し替える
      - EXTERNAL_BASE_URL=http://external.invalid
